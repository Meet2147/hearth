# fly launch --no-deploy   then   fly deploy
# Fly terminates TLS for you, so clients connect with wss:// and no certificate
# work is needed on your side.
app = "hearth-relay"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  MAX_PER_ROOM = "16"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    # Sessions are long-lived and can sit quiet between commands.
    idle_timeout = 900

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
