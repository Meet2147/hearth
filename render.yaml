# Render blueprint. Deploying the landing page as a static site: Render issues
# and renews the TLS certificate itself, which for a .app domain is the whole
# ballgame - .app is HSTS-preloaded, so a site without a valid certificate is
# not reachable at all, it is not merely insecure.
services:
  - type: web
    name: hearth-site
    runtime: static
    # Nothing to compile: the page is a single self-contained file.
    buildCommand: "echo 'static site, nothing to build'"
    staticPublishPath: ./docs
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

  # The relay: a blind WebSocket switchboard. Render terminates TLS, so clients
  # connect over wss:// and the relay only ever sees ciphertext. It has no
  # dependencies to install; it binds Render's $PORT on 0.0.0.0 on its own.
  - type: web
    name: hearth-relay
    runtime: node
    plan: free
    buildCommand: "echo 'no dependencies to install'"
    startCommand: "node relay.js"
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: MAX_PER_ROOM
        value: "16"
      - key: IDLE_MS
        value: "600000"
