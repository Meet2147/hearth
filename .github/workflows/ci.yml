name: ci

# Tests run on all three platforms. That is the point of this file: the Windows
# runner is the only place lib/hearth-helper.ps1 is ever executed, so a green
# Windows job is what turns "written" into "verified" for Windows hosting.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          node --version
          echo "platform: ${{ runner.os }}"

      # Hearth itself has no dependencies, so there is nothing to install.
      - name: Run the suite
        run: node test/run.js

  build:
    name: build (${{ matrix.os }})
    needs: test
    # Only build (and notarize) installers for version tags or a manual run —
    # not on every commit. Ordinary pushes just run the test job above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # to publish installers to the release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: desktop/dist/*.dmg
          - os: windows-latest
            target: --win
            files: desktop/dist/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop toolchain
        working-directory: desktop
        run: npm ci

      - name: Draw icons
        working-directory: desktop
        run: node ../tools/icons.js build

      - name: Build
        working-directory: desktop
        # macOS: if the Developer ID secrets are present, sign + notarize so the
        # download opens with a plain double-click. If they are not, fall back to
        # a valid ad-hoc signature (via after-pack.js) so the build still works,
        # just with the ordinary "unidentified developer" prompt.
        # Windows/Linux: unsigned for now.
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ''
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "Developer ID secrets present — signing and notarizing"
              # Apple's notary service returns transient 500s; retry a few times
              # before failing the release.
              n=0
              until npx electron-builder --mac --config.mac.notarize=true --publish never; do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then echo "notarization failed after $n attempts"; exit 1; fi
                echo "notarization attempt $n failed — retrying in 60s"; sleep 60
              done
            else
              echo "No Developer ID secrets — ad-hoc build (unsigned)"
              CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never
            fi
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.target }} --publish never
          fi

      # Publish this OS's installers straight to the GitHub Release — no
      # actions/upload-artifact hop, which has a tiny free-tier storage quota
      # that large Electron builds blow through. Each build job appends its own
      # files to the same tagged release; the first to arrive creates it.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # draft:false so the site's /releases/latest/download links resolve.
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ matrix.files }}
