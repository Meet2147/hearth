name: ci

# Tests run on all three platforms. That is the point of this file: the Windows
# runner is the only place lib/hearth-helper.ps1 is ever executed, so a green
# Windows job is what turns "written" into "verified" for Windows hosting.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          node --version
          echo "platform: ${{ runner.os }}"

      # Hearth itself has no dependencies, so there is nothing to install.
      - name: Run the suite
        run: node test/run.js

  build:
    name: build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: hearth-macos
          - os: windows-latest
            target: --win
            artifact: hearth-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop toolchain
        working-directory: desktop
        run: npm ci

      - name: Draw icons
        working-directory: desktop
        run: node ../tools/icons.js build

      - name: Build
        working-directory: desktop
        # Unsigned builds. Signing needs certificates in secrets; without them
        # electron-builder would otherwise try, and fail, to discover an identity.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true          # a human decides when it actually ships
          generate_release_notes: true
