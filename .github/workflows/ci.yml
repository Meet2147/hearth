name: ci

# Tests run on all three platforms. That is the point of this file: the Windows
# runner is the only place lib/hearth-helper.ps1 is ever executed, so a green
# Windows job is what turns "written" into "verified" for Windows hosting.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing should not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          node --version
          echo "platform: ${{ runner.os }}"

      # Hearth itself has no dependencies, so there is nothing to install.
      - name: Run the suite
        run: node test/run.js

  build:
    name: build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: hearth-macos
          - os: windows-latest
            target: --win
            artifact: hearth-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop toolchain
        working-directory: desktop
        run: npm ci

      - name: Draw icons
        working-directory: desktop
        run: node ../tools/icons.js build

      - name: Build
        working-directory: desktop
        # macOS: if the Developer ID secrets are present, sign + notarize so the
        # download opens with a plain double-click. If they are not, fall back to
        # a valid ad-hoc signature (via after-pack.js) so the build still works,
        # just with the ordinary "unidentified developer" prompt.
        # Windows/Linux: unsigned for now.
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ''
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "Developer ID secrets present — signing and notarizing"
              npx electron-builder --mac --config.mac.notarize=true --publish never
            else
              echo "No Developer ID secrets — ad-hoc build (unsigned)"
              CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never
            fi
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.target }} --publish never
          fi

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true          # a human decides when it actually ships
          generate_release_notes: true
