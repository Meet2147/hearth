<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Hearth</title>
<style>
  :root { --bg:#12100e; --muted:#8d8276; --bad:#f87171; --ember:#ff9d4d; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--muted);
    font:14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display:grid; place-items:center; padding:40px; -webkit-user-select:none; user-select:none;
    -webkit-app-region:drag;
  }
  .box { text-align:center; max-width:520px; }
  .flame {
    width:44px; height:44px; border-radius:14px; margin:0 auto 22px;
    background:radial-gradient(circle at 50% 78%, #ffd08a 0%, var(--ember) 42%, #d1500f 100%);
    box-shadow:0 0 34px -8px var(--ember);
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.75; transform:scale(.97)} 50%{opacity:1; transform:scale(1)} }
  .msg { white-space:pre-wrap; word-break:break-word; -webkit-user-select:text; user-select:text; }
  .msg.error { color:var(--bad); text-align:left; font-size:13px;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .box.failed .flame { animation:none; filter:grayscale(.7); opacity:.4; }
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="flame"></div>
    <div class="msg" id="msg">Starting your session…</div>
  </div>
<script>
  // The main process passes state in the hash so this page needs no privileges.
  try {
    var raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (raw) {
      var state = JSON.parse(raw);
      document.getElementById('msg').textContent = state.message || '';
      if (state.error) {
        document.getElementById('msg').className = 'msg error';
        document.getElementById('box').className = 'box failed';
      }
    }
  } catch (e) {}
</script>
</body>
</html>
